# pytest.ini — Configuración de pytest para el proyecto
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mostrar tests lentos (>1s)
addopts =
    -v
    --tb=short
    --durations=10

# Markers personalizados
markers =
    unit: Tests unitarios (sin dependencias externas)
    integration: Tests de integración (requieren ChromaDB o GPU)
    slow: Tests lentos (>5 segundos)

# Ignorar warnings de librerías externas
filterwarnings =
    ignore::DeprecationWarning:langchain
    ignore::DeprecationWarning:langgraph
    ignore::UserWarning:transformers
    ignore::FutureWarning
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:crypt.*
